name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Generate icon
        run: python scripts/generate_icon.py

      - name: Install FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --name VideoResizerStudio --icon assets/app.ico --collect-all cv2 main.py

      - name: Bundle ffmpeg binaries into dist
        shell: pwsh
        run: |
          $binDir = "dist\VideoResizerStudio\ffmpeg"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $ffmpeg = (Get-Command ffmpeg).Source
          $ffprobe = (Get-Command ffprobe).Source
          Copy-Item $ffmpeg $binDir
          Copy-Item $ffprobe $binDir
          Write-Host "Bundled ffmpeg from: $ffmpeg"

      - name: Build Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/VideoResizerStudio.iss
          options: /DMyAppVersion=${{ github.ref_name }}

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VideoResizerStudio/* -DestinationPath dist/VideoResizerStudio-${{ github.ref_name }}-win64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/VideoResizerStudio-${{ github.ref_name }}-win64.zip
            dist/installer/VideoResizerStudio-Setup-${{ github.ref_name }}.exe
